name: Test Install Scripts

on: workflow_dispatch

jobs:
  test-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test irm install
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex
          adm --version
